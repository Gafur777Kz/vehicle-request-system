# ноутбук: локальный PostgreSQL, учебный пароль css/css
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/css
    username: css
    password: css
  jpa:
    show-sql: true

app:
  # сосед, которому будем звонить в Lab 6. Сейчас только читаем значение
  downstream:
    base-url: http://localhost:9090
    timeout: 2s
  # ключ для подписи JWT (HS256), минимум 32 символа. Только для ноутбука
  jwt:
    secret: dev-only-vehicle-request-secret-0123456789
