# общее для всех запусков, паролей здесь нет
spring:
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Boot не показывает клиенту стектрейс и текст исключения
server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# наружу только health и info
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Vehicle Request System

# в Swagger только те ответы, которые мы сами указали на методе
springdoc:
  override-with-generic-response: false
